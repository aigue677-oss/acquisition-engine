name: Elite Autonomous Acquisition Engine

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours around the clock
  workflow_dispatch:      # Keeps the manual run button active in your Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests google-genai

      - name: Execute Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REAL_ESTATE_API_URL: ${{ secrets.REAL_ESTATE_API_URL }}
          SKIPTRACE_API_KEY: ${{ secrets.SKIPTRACE_API_KEY }}
        run: |
          python pipeline.py
          
