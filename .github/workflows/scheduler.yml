name: Autonomous Acquisition Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # PERMISSIONS: Allow the GitHub Action to read and write code changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline.py

      - name: Commit and Push Memory Ledger Updates
        run: |
          git config --global user.name "Autonomous Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_assets.json
          git commit -m "Auto: Update seen assets memory ledger [skip ci]" || echo "No changes to commit"
          git push
          
